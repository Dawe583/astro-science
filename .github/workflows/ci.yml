name: CI - Notebook Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          
      - name: Run notebook health check
        run: |
          bash /home/dawe/Projects/astro-science/.opencode/loops/notebook-health.sh
        timeout: 120000
      
      - name: Verify formulas
        run: |
          cd research/projects/exoplanets
          .venv/bin/python scripts/verify_formulas.py
        timeout: 60000
